name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v6

      - name: Generate OrigamiKing4723 stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&line_height=27&theme=transparent
          path: profile/origamiking4723-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OrigamiKing3612 stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=OrigamiKing3612&show_icons=true&count_private=true&line_height=27&theme=transparent
          path: profile/origamiking3612-stats.svg
          token: ${{ secrets.PAT1 }}
          
      - name: Generate OrigamiKing4723 Top Langs stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=transparent&count_private=true&hide=markdown&langs_count=5
          path: profile/origamiking4723-top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate OrigamiKing3612 Top Langs stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=OrigamiKing3612&theme=transparent&count_private=true&hide=markdown&langs_count=5
          path: profile/origamiking3612-top-langs.svg
          token: ${{ secrets.PAT1 }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
